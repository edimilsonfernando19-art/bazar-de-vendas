<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bazar de Vendas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f0f2f5;
    color:#1c1e21;
}

/* TOPO */

.topbar{
    height:64px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#1264d8;
    white-space:nowrap;
}

.search{
    flex:1;
    max-width:480px;
    background:#f0f2f5;
    border:0;
    border-radius:24px;
    padding:12px 17px;
    outline:none;
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:9px;
}

.iconbtn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:0;
    background:#eef1f5;
    font-size:20px;
    cursor:pointer;
}

/* MENU */

.nav{
    background:#fff;
    display:flex;
    justify-content:center;
    gap:5px;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:64px;
    z-index:15;
}

.nav button{
    background:none;
    border:0;
    padding:14px 22px;
    color:#606770;
    font-weight:650;
    border-bottom:3px solid transparent;
    cursor:pointer;
}

.nav button.active{
    color:#1264d8;
    border-color:#1264d8;
}

/* CONTAINER */

.container{
    max-width:1050px;
    margin:auto;
}

main{
    padding:16px 10px 80px;
}

.card{
    background:#fff;
    border-radius:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
    margin-bottom:14px;
    overflow:hidden;
}

/* CRIAR PUBLICAÇÃO */

.create{
    padding:15px;
}

.create-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#1264d8;
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:800;
}

.create-input{
    flex:1;
    background:#f0f2f5;
    border-radius:25px;
    padding:12px 17px;
    color:#65676b;
    cursor:pointer;
}

.quick{
    display:flex;
    border-top:1px solid #eee;
    margin-top:14px;
    padding-top:12px;
    gap:8px;
}

.quick button{
    flex:1;
    background:#fff;
    border:0;
    padding:9px;
    border-radius:8px;
    color:#555;
    cursor:pointer;
}

.quick button:hover{
    background:#f0f2f5;
}

/* HISTÓRIAS */

.stories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:14px;
}

.story{
    min-width:112px;
    height:180px;
    border-radius:12px;
    background:linear-gradient(145deg,#1264d8,#7b2cff);
    color:#fff;
    display:flex;
    align-items:flex-end;
    padding:10px;
    font-weight:700;
}

.story:first-child{
    background:#ddd;
    color:#222;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.section-title{
    font-size:20px;
    font-weight:750;
    padding:15px 15px 4px;
}

/* PRODUTOS */

.product-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:15px;
}

.product{
    border:1px solid #e3e5e8;
    border-radius:12px;
    overflow:hidden;
    background:#fff;
}

.product-img{
    height:175px;
    background:#e9edf2;
    display:grid;
    place-items:center;
    font-size:58px;
}

.product-body{
    padding:10px;
}

.price{
    font-weight:800;
    font-size:18px;
}

.product-name{
    font-weight:650;
    margin:3px 0;
}

.meta{
    color:#65676b;
    font-size:13px;
}

.buy{
    background:#1264d8;
    color:#fff;
    width:100%;
    padding:9px;
    border-radius:8px;
    margin-top:9px;
    font-weight:700;
    border:0;
    cursor:pointer;
}

/* PUBLICAÇÕES */

.post{
    padding:14px;
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-name{
    font-weight:750;
}

.post-time{
    font-size:12px;
    color:#65676b;
}

.post-text{
    padding:12px 0;
    line-height:1.45;
}

.post-image{
    width:100%;
    height:270px;
    background:#e7ebef;
    display:grid;
    place-items:center;
    font-size:80px;
    border-radius:10px;
}

.stats{
    display:flex;
    justify-content:space-between;
    color:#65676b;
    font-size:13px;
    padding:9px 2px;
    border-bottom:1px solid #eee;
}

.post-actions{
    display:flex;
    gap:5px;
    padding-top:7px;
}

.post-actions button{
    flex:1;
    background:#fff;
    border:0;
    padding:9px;
    border-radius:7px;
    color:#555;
    font-weight:650;
}

/* MODAL */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:15px;
}

.modal{
    background:#fff;
    width:min(520px,100%);
    border-radius:16px;
    padding:20px;
}

.modal h2{
    margin-bottom:14px;
}

.close{
    float:right;
    background:#eef1f5;
    width:34px;
    height:34px;
    border-radius:50%;
    border:0;
}

.field{
    width:100%;
    padding:12px;
    border:1px solid #ccd0d5;
    border-radius:9px;
    margin-bottom:10px;
    outline:none;
}

textarea.field{
    min-height:100px;
    resize:vertical;
}

.primary{
    background:#1264d8;
    color:#fff;
    padding:12px;
    border-radius:9px;
    font-weight:750;
    width:100%;
    border:0;
    cursor:pointer;
}

/* MOBILE */

.bottom{
    display:none;
}

@media(max-width:700px){

    .topbar{
        padding:0 10px;
    }

    .logo{
        font-size:20px;
    }

    .search{
        max-width:none;
    }

    .nav{
        justify-content:flex-start;
        overflow-x:auto;
    }

    .nav button{
        padding:13px 16px;
        white-space:nowrap;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-img{
        height:145px;
    }

    .bottom{
        position:fixed;
        display:flex;
        bottom:0;
        left:0;
        right:0;
        background:#fff;
        z-index:30;
        justify-content:space-around;
        border-top:1px solid #ddd;
    }

    .bottom button{
        background:#fff;
        border:0;
        padding:10px 8px;
        font-size:12px;
        color:#555;
    }

    .bottom button.active{
        color:#1264d8;
        font-weight:800;
    }

    main{
        padding-bottom:75px;
    }
}
</style>
</head>

<body>

<header class="topbar">

<div class="logo">
Bazar de Vendas
</div>

<input
class="search"
id="search"
placeholder="Pesquisar produtos, serviços..."
oninput="renderProducts()">

<div class="top-actions">

<button
class="iconbtn"
onclick="openModal()">
＋
</button>

<button
class="iconbtn"
onclick="alert('Mensagens em breve')">
💬
</button>

</div>

</header>


<nav class="nav">

<button
class="active"
onclick="showSection('inicio',this)">
⌂ Início
</button>

<button
onclick="showSection('mercado',this)">
🛍 Marketplace
</button>

<button
onclick="showSection('meus',this)">
👤 Meu espaço
</button>

</nav>


<main class="container">

<section id="inicio">

<!-- CRIAR -->

<div class="card create">

<div class="create-row">

<div class="avatar">
EU
</div>

<div
class="create-input"
onclick="openModal()">

O que queres vender ou publicar?

</div>

</div>


<div class="quick">

<button onclick="openModal()">
📷 Foto
</button>

<button onclick="openModal()">
🛍 Produto
</button>

<button onclick="openModal()">
📢 Serviço
</button>

</div>

</div>


<!-- HISTÓRIAS -->

<div class="card">

<div class="section-title">
Histórias
</div>

<div class="stories">

<div class="story"
onclick="openModal()">

＋
<br>
Criar história

</div>

<div class="story">
🔥
<br>
Promoções
</div>

<div class="story">
📱
<br>
Telemóveis
</div>

<div class="story">
👟
<br>
Moda
</div>

<div class="story">
💼
<br>
Serviços
</div>

</div>

</div>


<!-- PRODUTOS -->

<div class="card">

<div class="section-title">
Produtos em destaque
</div>

<div
id="homeProducts"
class="product-grid">
</div>

</div>


<!-- FEED -->

<div id="feed">
</div>

</section>


<!-- MARKETPLACE -->

<section
id="mercado"
style="display:none">

<div class="card">

<div class="section-title">
Marketplace
</div>

<div style="padding:10px 15px">

<input
class="field"
id="marketSearch"
placeholder="Pesquisar no marketplace..."
oninput="renderProducts()">

</div>

<div
id="marketProducts"
class="product-grid">
</div>

</div>

</section>


<!-- MEU ESPAÇO -->

<section
id="meus"
style="display:none">

<div class="card">

<div class="section-title">
Meu espaço
</div>

<div style="padding:35px;text-align:center">

<h3>
👤 Minha conta
</h3>

<p style="margin:10px 0;color:#65676b">
Gere os teus produtos, serviços e publicações.
</p>

<button
class="primary"
onclick="openModal()">

＋ Criar publicação

</button>

</div>

</div>

</section>

</main>


<!-- MENU MOBILE -->

<div class="bottom">

<button
class="active"
onclick="showSection('inicio',this)">
⌂<br>Início
</button>

<button
onclick="showSection('mercado',this)">
🛍<br>Mercado
</button>

<button
onclick="openModal()">
＋<br>Publicar
</button>

<button
onclick="showSection('meus',this)">
👤<br>Perfil
</button>

</div>


<!-- MODAL PUBLICAÇÃO -->

<div
id="modal"
class="modal-bg"
onclick="if(event.target===this)closeModal()">

<div class="modal">

<button
class="close"
onclick="closeModal()">
✕
</button>

<h2>
Nova publicação
</h2>

<input
id="pName"
class="field"
placeholder="Nome do produto ou serviço">

<input
id="pPrice"
class="field"
placeholder="Preço — exemplo: 25.000 Kz">

<input
id="pLocation"
class="field"
placeholder="Localização">

<textarea
id="pText"
class="field"
placeholder="Descrição do produto ou serviço">
</textarea>

<select
id="pType"
class="field">

<option>
Produto
</option>

<option>
Serviço
</option>

<option>
Promoção
</option>

</select>

<button
class="primary"
onclick="publish()">

Publicar agora

</button>

</div>

</div>


<script>

const defaultProducts=[

{
name:"Smartphone",
price:"185.000 Kz",
loc:"Luanda",
emoji:"📱",
desc:"Telemóvel em excelente estado."
},

{
name:"Tênis",
price:"35.000 Kz",
loc:"Luanda",
emoji:"👟",
desc:"Tênis novo."
},

{
name:"Computador",
price:"320.000 Kz",
loc:"Viana",
emoji:"💻",
desc:"Computador para estudo e trabalho."
},

{
name:"Relógio",
price:"28.000 Kz",
loc:"Talatona",
emoji:"⌚",
desc:"Relógio moderno."
},

{
name:"Bolsa",
price:"22.000 Kz",
loc:"Luanda",
emoji:"👜",
desc:"Bolsa feminina."
},

{
name:"Serviço de Design",
price:"15.000 Kz",
loc:"Online",
emoji:"🎨",
desc:"Criação de artes."
}

];


let products =
JSON.parse(localStorage.getItem("bazarProducts"))
|| defaultProducts;


let posts =
JSON.parse(localStorage.getItem("bazarPosts"))
|| [

{
name:"Bazar de Vendas",
time:"Agora",
text:"Bem-vindo ao Bazar de Vendas! Aqui podes publicar produtos, serviços e oportunidades.",
emoji:"🛍️"
}

];


function productCard(p){

return `

<article class="product">

<div class="product-img">

${p.emoji || "📦"}

</div>

<div class="product-body">

<div class="price">

${p.price || "Preço sob consulta"}

</div>

<div class="product-name">

${p.name}

</div>

<div class="meta">

📍 ${p.loc || "Angola"}

</div>

<button
class="buy"
onclick="contactSeller('${p.name}')">

Tenho interesse

</button>

</div>

</article>

`;

}


function renderProducts(){

let q =
(
document.getElementById("search").value
+
(
document.getElementById("marketSearch")
?
document.getElementById("marketSearch").value
:
""
)
).toLowerCase();


let filtered =
products.filter(p =>
(
p.name+" "+
p.loc+" "+
p.desc
).toLowerCase().includes(q)
);


document.getElementById("homeProducts").innerHTML =
filtered.slice(0,6).map(productCard).join("")
||
"<p style='padding:20px'>Nenhum produto encontrado.</p>";


document.getElementById("marketProducts").innerHTML =
filtered.map(productCard).join("")
||
"<p style='padding:20px'>Nenhum produto encontrado.</p>";

}


function renderFeed(){

document.getElementById("feed").innerHTML =

posts.map(p => `

<article class="card post">

<div class="post-head">

<div class="avatar">

${(p.name || "EU").slice(0,2).toUpperCase()}

</div>

<div>

<div class="post-name">

${p.name}

</div>

<div class="post-time">

${p.time} · 🌐

</div>

</div>

</div>


<div class="post-text">

${p.text}

</div>


<div class="post-image">

${p.emoji || "🛍️"}

</div>


<div class="stats">

0 gostos

<span>
0 comentários · 0 partilhas
</span>

</div>


<div class="post-actions">

<button>
👍 Gosto
</button>

<button>
💬 Comentar
</button>

<button>
↗ Partilhar
</button>

</div>

</article>

`).join("");

}


function openModal(){

document.getElementById("modal").style.display="flex";

}


function closeModal(){

document.getElementById("modal").style.display="none";

}


function publish(){

let name =
document.getElementById("pName").value.trim();

if(!name){

alert("Indica o nome do produto ou serviço.");

return;

}


let price =
document.getElementById("pPrice").value.trim()
|| "Preço sob consulta";


let location =
document.getElementById("pLocation").value.trim()
|| "Angola";


let text =
document.getElementById("pText").value.trim()
|| "Nova publicação no Bazar de Vendas.";


let type =
document.getElementById("pType").value;


let emoji =
type === "Serviço"
?
"💼"
:
type === "Promoção"
?
"🔥"
:
"🛍️";


products.unshift({

name:name,
price:price,
loc:location,
emoji:emoji,
desc:text

});


posts.unshift({

name:"Minha publicação",
time:"Agora",
text:
name+
" — "+
text+
" | "+
price+
" | 📍 "+
location,
emoji:emoji

});


localStorage.setItem(
"bazarProducts",
JSON.stringify(products)
);


localStorage.setItem(
"bazarPosts",
JSON.stringify(posts)
);


closeModal();

renderProducts();

renderFeed();


document.getElementById("pName").value="";
document.getElementById("pPrice").value="";
document.getElementById("pLocation").value="";
document.getElementById("pText").value="";

}


function contactSeller(name){

alert(
"Interesse em: "+
name+
"\\n\\nNo sistema completo este botão poderá abrir WhatsApp ou o chat do vendedor."
);

}


function showSection(id,btn){

["inicio","mercado","meus"].forEach(

x => {

document.getElementById(x).style.display =
x === id
?
"block"
:
"none";

}

);


document.querySelectorAll(
".nav button,.bottom button"
)
.forEach(
b => b.classList.remove("active")
);


document.querySelectorAll(
`[onclick*="showSection('${id}'"]`
)
.forEach(
b => b.classList.add("active")
);


window.scrollTo({
top:0,
behavior:"smooth"
});

}


renderProducts();

renderFeed();

</script>

</body>
</html>
